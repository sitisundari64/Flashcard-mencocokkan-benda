  <script>
  lucide.createIcons();
  const cards = [...document.querySelectorAll('.flashcard')];
  const dots = [...document.querySelectorAll('#progress .dot')];
  const fbRight = document.getElementById('fb-right');
  const fbWrong = document.getElementById('fb-wrong');
  const nextBtn = document.getElementById('next');
  const donePanel = document.getElementById('done-panel');
  let current = 0, soundOn = true, ctx = null;

  function tone(freqs, type) {
    if (!soundOn) return;
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      const t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.32);
    });
  }

  function updateDots() {
    dots.forEach((d, i) => {
      d.classList.toggle('on', i < current);
      d.classList.toggle('cur', i === current && current < cards.length);
    });
  }

  function show(i) {
    cards.forEach((c, k) => { c.classList.toggle('hidden', k !== i); c.classList.remove('card-in'); });
    if (cards[i]) { void cards[i].offsetWidth; cards[i].classList.add('card-in'); }
    fbRight.classList.add('hidden'); fbWrong.classList.add('hidden'); nextBtn.classList.add('hidden');
    updateDots();
  }

  cards.forEach(card => {
    card.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.correct === 'true') {
          btn.classList.add('is-right');
          card.querySelectorAll('.opt').forEach(b => b.disabled = true);
          fbWrong.classList.add('hidden'); fbRight.classList.remove('hidden');
          nextBtn.classList.remove('hidden'); nextBtn.focus();
          tone([523, 659, 784, 1047], 'triangle');
        } else {
          btn.classList.remove('is-wrong'); void btn.offsetWidth;
          btn.classList.add('is-wrong');
          fbRight.classList.add('hidden'); fbWrong.classList.remove('hidden');
          tone([220, 196], 'sine');
        }
      });
    });
  });

  nextBtn.addEventListener('click', () => {
    current++;
    if (current >= cards.length) {
      cards.forEach(c => c.classList.add('hidden'));
      fbRight.classList.add('hidden'); nextBtn.classList.add('hidden');
      donePanel.classList.remove('hidden'); updateDots();
      tone([523, 659, 784, 659, 784, 1047], 'triangle');
    } else show(current);
  });

  document.getElementById('restart').addEventListener('click', () => {
    current = 0;
    cards.forEach(c => c.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('is-right', 'is-wrong'); }));
    donePanel.classList.add('hidden');
    show(0);
  });

  document.getElementById('sound-toggle').addEventListener('click', e => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute('aria-pressed', String(soundOn));
    document.getElementById('sound-on').classList.toggle('hidden', !soundOn);
    document.getElementById('sound-off').classList.toggle('hidden', soundOn);
  });

  show(0);
</script>
